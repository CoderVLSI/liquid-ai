name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: 'llama.cpp tag/branch/commit to build the on-device server from (LFM3 needs b11960 or newer)'
        default: 'b11960'
      cpu_arch:
        description: 'Arm CPU features for the server (OnePlus Nord 4 / Snapdragon 7+ Gen 3 supports all of these)'
        default: 'armv8.6-a+dotprod+i8mm+fp16'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  LLAMA_CPP_REF: ${{ inputs.llama_cpp_ref || 'b11960' }}
  CPU_ARCH: ${{ inputs.cpu_arch || 'armv8.6-a+dotprod+i8mm+fp16' }}

jobs:
  # ---------------------------------------------------------------------------------------------
  # 1) Cross-compile llama.cpp's server for Android arm64. The app ships it as libllama_server.so
  #    and launches it as a child process (llama.rn does not know the lfm3 architecture yet).
  # ---------------------------------------------------------------------------------------------
  server:
    name: server (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # the real thing, for the phone
          - abi: arm64-v8a
            cpu_flags: ${{ inputs.cpu_arch || 'armv8.6-a+dotprod+i8mm+fp16' }}
          # only used by the emulator smoke test (CI runners are x86_64)
          - abi: x86_64
            cpu_flags: ''
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached server binary
        id: cache
        uses: actions/cache@v4
        with:
          path: out/libllama_server.so
          key: llama-server-v1-${{ matrix.abi }}-${{ env.LLAMA_CPP_REF }}-${{ matrix.cpu_flags }}

      - name: Fetch llama.cpp ${{ env.LLAMA_CPP_REF }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          git -C llama.cpp log -1 --oneline

      - name: Configure (Android NDK, arm64-v8a)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK=$NDK"; ls "$NDK" | head -3
          ARCH_FLAG=""
          if [ -n "${{ matrix.cpu_flags }}" ]; then ARCH_FLAG="-DGGML_CPU_ARM_ARCH=${{ matrix.cpu_flags }}"; fi
          cmake -S llama.cpp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            $ARCH_FLAG \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384"

      - name: Build llama-server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --build build --target llama-server -j"$(nproc)"
          mkdir -p out
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cp build/bin/llama-server out/libllama_server.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/libllama_server.so
          file out/libllama_server.so || true

      - name: Inspect binary
        run: |
          ls -la out/
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h out/libllama_server.so | grep -E "Class|Machine|Type"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d out/libllama_server.so | grep NEEDED || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-${{ matrix.abi }}
          path: out/libllama_server.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # 2) Build the React Native (Expo) app and bundle the server binary into the APK.
  # ---------------------------------------------------------------------------------------------
  apk:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests + type check
        run: |
          npm test
          npm run typecheck

      - name: Add the server binary
        uses: actions/download-artifact@v4
        with:
          name: llama-server-arm64-v8a
          path: modules/liquid-native/android/src/main/jniLibs/arm64-v8a

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle settings
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify the APK carries the server and extracts native libs
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          unzip -l "$APK" | grep -E "libllama_server|libexpo|libreactnative" | head
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libllama_server.so"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i -E "extractNativeLibs|usesCleartextTraffic|RECORD_AUDIO"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'extractNativeLibs.*=true\|extractNativeLibs.*0xffffffff'

      - name: Signing certificate fingerprint (needed to register Google sign-in)
        run: |
          SHA1=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | grep 'SHA1:' | head -1 | sed 's/.*SHA1: *//')
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "### Signing certificate SHA-1 (for the Google OAuth Android client)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1: $SHA1"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/liquid-voice-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-voice-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish rolling pre-release (download the APK straight on the phone)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/pull/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Liquid Voice APK ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})" \
            --notes "Built from $GITHUB_SHA. llama.cpp $LLAMA_CPP_REF, CPU features $CPU_ARCH. Open this page on the phone and tap the .apk to install. Signing certificate SHA-1 (for Google sign-in): $SHA1"

  # ---------------------------------------------------------------------------------------------
  # 3) Launch the app in a real Android emulator and tap through it. Catches "crashes before it
  #    even opens": JS errors, missing native module, bad manifest, missing server binary...
  #    Uses an x86_64 build of the same code (the runner has KVM; the release APK stays arm64).
  # ---------------------------------------------------------------------------------------------
  smoke:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci --no-audit --no-fund

      - name: Add the x86_64 server binary
        uses: actions/download-artifact@v4
        with:
          name: llama-server-x86_64
          path: modules/liquid-native/android/src/main/jniLibs/x86_64

      - name: Target x86_64 (emulator) instead of arm64
        run: |
          sed -i 's/"buildArchs": \["arm64-v8a"\]/"buildArchs": ["x86_64"]/' app.json
          grep -n buildArchs app.json

      - run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle settings
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build emulator APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch in emulator and tap through the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke-test.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload smoke-test evidence (logcat, screenshots, UI dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: smoke-out/
          if-no-files-found: ignore
