plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liquidnative'
version = '0.1.0'

android {
  namespace "expo.modules.liquidnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  // libllama_server.so (the llama.cpp server) lives in src/main/jniLibs/arm64-v8a and is exec()'d from
  // nativeLibraryDir at runtime, so the *app* must extract native libs: that is configured in app.json
  // through expo-build-properties (android.useLegacyPackaging = true).
}
